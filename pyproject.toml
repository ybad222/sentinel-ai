[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Agentic AI assistant for SOC alert triage — human-in-the-loop and auditable"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q -m 'not llm'"
markers = ["llm: needs a running LLM (run with: pytest -m llm)"]

[tool.bandit]
exclude_dirs = ["tests"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
